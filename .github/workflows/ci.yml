name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: investigation
          POSTGRES_PASSWORD: investigation
          POSTGRES_DB: investigation_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U investigation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check --no-cache .
      - run: uv run ruff format --no-cache --check .
      - run: uv run ty check
      - run: uv run python tools/check_no_comments.py
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t investigation-engine .
